name: Skill proposal
description: Propose a grounded Codex skill from real practice or a repeated workflow.
title: "[Skill proposal]: "
labels:
  - skill-proposal
body:
  - type: markdown
    attributes:
      value: |
        Use this only for public clean-room proposals. Do not paste or summarize employer, customer, internal project, source task, incident, conversation, ticket, log, schema, topology, filename, workflow, or other private material. Start from an abstract capability and an independently designed public or synthetic domain.
  - type: input
    id: proposed-skill
    attributes:
      label: Proposed skill
      description: Working name or skill directory name, if known.
      placeholder: diagnose-api-regression
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Abstract capability and public need
      description: Describe the implementation-independent capability, invariant, authorization boundary, or failure mode. Do not identify or reconstruct the private work that motivated it.
      placeholder: "Capability: ... / public need: ..."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem the skill solves
      description: What concrete work should Codex perform, and what failure does the workflow prevent?
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Intended category
      description: Use the current taxonomy; pick the closest fit.
      options:
        - core-engineering
        - review-audit
        - planning-execution
        - agent-memory
        - research
        - tool-ops
        - visual-artifacts
        - publishing
    validations:
      required: true
  - type: dropdown
    id: maturity
    attributes:
      label: Maturity level
      options:
        - practice-note
        - personal-skill
        - portable-candidate
        - stable-workflow
        - deprecated
    validations:
      required: true
  - type: dropdown
    id: side-effect-level
    attributes:
      label: Highest normal side-effect level
      options:
        - none
        - read-only
        - local-files
        - git-working-tree
        - external-api-read
        - external-api-write
        - publish
        - destructive
    validations:
      required: true
  - type: textarea
    id: sanitization
    attributes:
      label: Public sanitization considerations
      description: Confirm that no private source material is present and explain the unrelated public or synthetic domain, actors, terminology, data, fixtures, and workflow expression used for clean-room design. Replacing identifiers alone is not sufficient.
      placeholder: "Private material present: no / synthetic domain: ... / structural independence review: ..."
    validations:
      required: true
  - type: checkboxes
    id: clean-room
    attributes:
      label: Clean-room declaration
      options:
        - label: I did not include or reconstruct private prose, code, schemas, workflows, topology, filenames, fixtures, examples, identifiers, or artifacts.
          required: true
        - label: The proposal uses independently designed public or synthetic actors, terminology, data, fixtures, and workflow expression.
          required: true
  - type: textarea
    id: portability
    attributes:
      label: Portability notes
      description: Which details are local or practice-derived, and what should future adopters substitute?
  - type: textarea
    id: validation
    attributes:
      label: Validation performed or planned
      description: Include automated checks, manual checks, dry-runs, examples, or why validation is deferred.
  - type: textarea
    id: examples
    attributes:
      label: Examples added or intentionally deferred
      description: What examples, references, scripts, templates, or fixtures should accompany this skill?
  - type: textarea
    id: repo-surface
    attributes:
      label: Registry, schema, and docs updates
      description: Note expected changes to skills/index.json, schemas, README, docs, or agent metadata. Use N/A when none.
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: What should this proposal explicitly avoid changing or generalizing?
    validations:
      required: true
