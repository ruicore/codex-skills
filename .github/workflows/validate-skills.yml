name: Validate skills

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-skills:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill registry and files
        env:
          PUBLIC_HYGIENE_DENYLIST: ${{ secrets.PUBLIC_HYGIENE_DENYLIST }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python scripts/validate_skills.py
            echo "::notice::Public PR checks are not authoritative until the protected private-denylist gate passes."
          else
            python scripts/validate_skills.py --require-denylist
          fi

      - name: Test public hygiene scanner
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Scan proposed commit history
        env:
          PUBLIC_HYGIENE_DENYLIST: ${{ secrets.PUBLIC_HYGIENE_DENYLIST }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            revision_range="$BASE_SHA..$HEAD_SHA"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]] &&
            git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null &&
            git merge-base --is-ancestor "$BEFORE_SHA" "$HEAD_SHA"; then
            revision_range="$BEFORE_SHA..$HEAD_SHA"
          else
            revision_range="$HEAD_SHA"
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python scripts/check_public_hygiene.py --mode public --range "$revision_range"
            echo "::notice::A protected private-denylist scan is still required before merge."
          else
            python scripts/check_public_hygiene.py --mode protected --range "$revision_range"
          fi

      - name: List all skills
        run: python scripts/list_skills.py

      - name: List review and audit skills
        run: python scripts/list_skills.py --category review-audit

      - name: Smoke test single-skill install plan
        run: python scripts/install_skill.py diagnose --dry-run

      - name: Smoke test category install plan
        run: python scripts/install_skill.py --category core-engineering --target /tmp/codex-skills-install --dry-run
